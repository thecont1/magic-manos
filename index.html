<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magic-manos — filters</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: row;
    background: #101012; color: #d8d6d0;
    font: 13px/1.45 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    overflow: hidden;
  }

  /* Left sidebar holds every control; the stage keeps the rest of the
     window — width for the image, height for the picture. */
  #side {
    flex: 0 0 264px; width: 264px;
    border-right: 1px solid #26262a;
    background: #131315;
    padding: 12px 13px 14px;
    display: flex; flex-direction: column; gap: 13px;
    overflow-y: auto;
  }
  /* ---- logo ------------------------------------------------------- */
  .logo { display: flex; align-items: baseline; }
  .logo .word {
    font-size: 19px; line-height: 1; color: #a8a6ae;
    letter-spacing: -.012em; text-shadow: 0 0 22px #ffb45e1f;
  }
  .logo .word b { font-weight: 600; color: #f4f1ea; }
  .logo .sep { color: #ffb45e; font-weight: 300; margin: 0 2px; }
  .tag { color: #6a6970; font-size: 11px; letter-spacing: .04em; }

  .dim { color: #77767d; }
  strong { font-weight: 600; letter-spacing: .01em; }

  /* ---- panels ------------------------------------------------------ */
  /* Each section is a panel with a tab bar on top: the bar carries the
     title, its top corners are square, and the body sits below it with room
     to breathe. The panel keeps a full border, top edge included. */
  .panel {
    border: 1px solid #26262a;
    border-radius: 0 0 10px 10px;
    background: #161619; padding: 0 12px 12px;
    display: flex; flex-direction: column;
  }
  /* The filter section is the point of the app — it gets the accent. */
  .panel.filter-panel {
    border-color: #4a3d28;
    background: #1a1814;
  }
  .panel-head {
    margin: 0 -12px;
    padding: 8px 12px 9px;
    background: #1e1e22;
    border-bottom: 1px solid #26262a;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .filter-panel .panel-head {
    background: linear-gradient(180deg, #2c2215, #1d1a16);
    border-bottom-color: #4a3d28;
  }
  .panel-head .label {
    font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: #8a8890;
  }
  .filter-panel .panel-head .label { color: #ffb45e; }
  .panel-body { display: flex; flex-direction: column; gap: 9px; padding-top: 15px; }
  /* The file input stays in the tab order — the `hidden` attribute would take
     it out of it, and the label alone is not keyboard reachable. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row .mini { font-size: 11px; color: #8a8890; }

  .btn {
    appearance: none; border: 1px solid #3a3a40; border-radius: 6px;
    background: #1b1b1f; color: #d8d6d0; padding: 6px 11px;
    font: inherit; cursor: pointer; user-select: none; text-align: center;
  }
  .btn:hover { border-color: #55555e; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; padding: 4px 8px; }
  .btn.on { background: #2c2c33; color: #f0eee8; border-color: #55555e; }

  /* On/off switch — the filter's master gate. */
  .toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle .sw {
    position: relative; flex: 0 0 auto;
    width: 34px; height: 19px; border-radius: 999px;
    border: 1px solid #3a3a40; background: #1b1b1f; transition: all .15s;
  }
  .toggle .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 13px; height: 13px; border-radius: 50%;
    background: #6b6a72; transition: all .15s;
  }
  .toggle input:checked + .sw { background: #ffb45e26; border-color: #ffb45e; }
  .toggle input:checked + .sw::after { left: 17px; background: #ffb45e; box-shadow: 0 0 8px #ffb45e88; }
  .toggle input:focus-visible + .sw { outline: 2px solid #ffb45e88; outline-offset: 2px; }
  .toggle .tname { flex: 1; }

  /* One slider per row: name + value on top, track below. Only the selected
     filter's sliders are here — each filter declares its own set. */
  #params { display: flex; flex-direction: column; gap: 9px; }
  .prow { display: flex; flex-direction: column; gap: 2px; }
  .prow .head { display: flex; justify-content: space-between; align-items: baseline; }
  .prow .head span { color: #9c9aa2; }
  .prow .head output { color: #d8d6d0; font-variant-numeric: tabular-nums; }
  .prow input[type="range"] { width: 100%; accent-color: #ffb45e; margin: 0; }
  /* Filter off: the panel body dims, but the switch itself stays lit. */
  #side.off .filter-panel .panel-body { opacity: .4; }

  select {
    background: #1b1b1f; border: 1px solid #3a3a40; border-radius: 6px;
    color: #d8d6d0; font: inherit; padding: 5px 6px; width: 100%;
  }

  .seg { display: flex; border: 1px solid #3a3a40; border-radius: 6px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: #9c9aa2;
    padding: 4px 10px; font: inherit; cursor: pointer; flex: 1;
  }
  .seg button.on { background: #2c2c33; color: #f0eee8; }

  #stat { font-variant-numeric: tabular-nums; color: #77767d; }
  .keys { color: #5f5e66; font-size: 11px; }
  .keys kbd {
    border: 1px solid #33333a; border-radius: 4px; padding: 0 4px;
    font: 10px ui-monospace, monospace; color: #9c9aa2;
  }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 5px; padding-top: 6px; }

  main {
    position: relative; flex: 1; min-width: 0; overflow: auto;
    display: grid; place-items: center;
    background:
      radial-gradient(1200px 600px at 50% 0%, #151518, #101012);
  }
  main.z100 { display: block; padding: 24px; }
  main.z100 canvas { margin: 0 auto; }

  canvas {
    display: block;
    box-shadow: 0 8px 60px #000a, 0 0 0 1px #ffffff14;
  }
  /* The author rule above outranks the UA [hidden] rule, so the canvas would
     otherwise sit in the stage as a 300x150 ghost. */
  canvas[hidden], #empty[hidden] { display: none; }
  /* Empty state and canvas share one grid cell — they never stack. */
  #empty, canvas { grid-area: 1 / 1; place-self: center; }
  /* Fit = the whole picture, letterboxed. The canvas is a replaced element
     with an intrinsic size, so max-width/max-height clamp it on both axes
     while it keeps its aspect ratio. */
  main.fit {
    overflow: hidden; padding: 14px;
    grid-template-rows: 100%; grid-template-columns: minmax(0, 1fr);
  }
  main.fit canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  /* 100% = one source pixel per device pixel, scrollbars and all. */
  main.z100 canvas { max-width: none; max-height: none; width: auto; height: auto; margin: 0 auto; }

  #empty {
    text-align: center; color: #9c9aa2; line-height: 1.9; padding: 40px;
  }
  #empty kbd {
    border: 1px solid #3a3a40; border-radius: 4px; padding: 0 5px;
    font: 11px ui-monospace, monospace; color: #d8d6d0;
  }

  #chip {
    position: absolute; top: 12px; right: 14px;
    padding: 3px 10px; border-radius: 999px;
    background: #ffb45e22; border: 1px solid #ffb45e66; color: #ffb45e;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  main.on #chip { opacity: 1; }

  main.drag::after {
    content: "drop to load";
    position: absolute; inset: 10px; display: grid; place-items: center;
    border: 2px dashed #ffb45e88; border-radius: 10px;
    background: #101012cc; color: #ffb45e; font-size: 15px;
    pointer-events: none;
  }

  /* Narrow windows: the sidebar turns into a top strip so the picture still
     gets the full width, and the panels scroll sideways instead of pushing
     the image down. */
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #side {
      flex: 0 0 auto; width: 100%;
      border-right: 0; border-bottom: 1px solid #26262a;
      flex-direction: row; align-items: flex-start;
      overflow-x: auto; overflow-y: hidden; gap: 14px;
    }
    #side .panel { min-width: 190px; }
    #side .panel.filter-panel { min-width: 230px; }
    .side-foot { margin-top: 0; padding-top: 0; }
  }
</style>

<aside id="side" class="side off">
  <div>
    <div class="logo">
      <span class="word">magic<span class="sep">–</span><b>manos</b></span>
    </div>
    <div class="tag">photographic filter lab</div>
  </div>

  <section class="panel image-panel">
    <div class="panel-head"><span class="label">Image</span></div>
    <div class="panel-body">
      <label class="btn">Choose image<input id="file" class="visually-hidden" type="file" accept="image/*"></label>
      <button id="sample" class="btn">Load Test pattern</button>
      <button id="forget" class="btn ghost" hidden>Clear image</button>
      <div class="row">
        <span class="mini">Dimensions</span>
        <span id="dims" class="dim">—</span>
      </div>
      <div class="row">
        <span class="mini">Zoom</span>
        <div class="seg" id="zoomseg"><button data-z="fit" class="on">Fit</button><button data-z="z100">100%</button></div>
      </div>
    </div>
  </section>

  <section class="panel filter-panel">
    <div class="panel-head">
      <span class="label">Filter</span>
      <label class="toggle" title="Filter on/off">
        <input id="on" type="checkbox" aria-label="Filter on/off">
        <span class="sw"></span>
      </label>
    </div>
    <div class="panel-body">
      <select id="filter" aria-label="Filter"></select>
      <div id="params"></div>
      <button id="reset" class="btn ghost">reset</button>
    </div>
  </section>

  <section class="panel export-panel">
    <div class="panel-head"><span class="label">Export</span></div>
    <div class="panel-body">
      <button id="save" class="btn" disabled>Save PNG</button>
      <button id="settings" class="btn">Settings ↓</button>
    </div>
  </section>

  <div class="side-foot">
    <div id="stat" class="dim">no image</div>
    <div class="keys"><kbd>f</kbd> filter · <kbd>s</kbd> save · <kbd>1</kbd>/<kbd>0</kbd> zoom</div>
  </div>
</aside>
<main id="stage" class="fit">
  <div id="empty">
    Drop an image here, choose a file, or press “Load Test pattern”.<br>
    <span class="dim">Your last image comes back on its own — until then, these are untouched source pixels.</span>
  </div>
  <canvas id="gl" hidden></canvas>
  <span id="chip"></span>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl'), empty = $('empty'), stat = $('stat');
const side = $('side'), onToggle = $('on');
// One-click filters registry — each entry owns its name, param surface and
// defaults. Bloom is the first; more slot in here. Exactly one filter is
// selected at a time, and its `kind` picks the renderer that draws it.
const FILTERS = {
  bloom: {
    name: 'Bloom',
    kind: 'bloom',
    // radius is the glow's width in source pixels — 18px of glow is 18px
    // whatever the frame is, so the look is what you dial in, not what the
    // resolution decides. (The preview is the full-res render scaled down by
    // the browser, so preview and export always agree.)
    //
    // Defaults are the user's call (2026-11-05): radius 18px, thresh 0.8,
    // sharp 0.5, boost 1.0 — a tight, bright glow. The Bloom evaluation on a
    // hard-midday 4608×3456 frame had preferred the opposite: a wide, weak
    // "dreamy" bloom, where a narrow strong bloom rings every high-contrast
    // edge and reads as a phone filter.
    defaults: { radius: 18, thresh: 0.8, sharp: 0.5, boost: 1.0 },
    params: [
      { key: 'radius', min: 0, max: 150, step: 1,
        fmt: v => `${Math.round(v)} px` },
      { key: 'thresh', min: 0, max: 1, step: 0.01 },
      { key: 'sharp',  min: 0, max: 1, step: 0.01 },
      { key: 'boost',  min: 0.5, max: 1.5, step: 0.01 },
    ],
  },
  poppzz: {
    name: 'poppzz',
    kind: 'poppzz',
    // The subject is found by classical saliency — colour rarity, colour
    // contrast against the frame and against its edges, a gentle centre
    // prior — thresholded with Otsu and cleaned up morphologically.
    // Deterministic, no model, a few tens of milliseconds on a 256px copy, so
    // the mask is built once per image and the sliders below stay live.
    //
    // `mask: true` marks the sliders that change the mask itself (rather than
    // the composite); those trigger a rebuild instead of a redraw.
    defaults: { scale: 1.03, feather: 12, bgDim: 0.18, bgDesat: 0.12, shadow: 0.35,
                threshold: 0, centerWeight: 0.4, subjects: 3 },
    params: [
      { key: 'scale', min: 1, max: 1.1, step: 0.005,
        fmt: v => `${v.toFixed(3)}×` },
      { key: 'feather', min: 0, max: 40, step: 1,
        fmt: v => `${Math.round(v)} px` },
      { key: 'bgDim', min: 0, max: 0.6, step: 0.01,
        fmt: v => `${Math.round(v * 100)}%` },
      { key: 'bgDesat', min: 0, max: 1, step: 0.01,
        fmt: v => `${Math.round(v * 100)}%` },
      { key: 'shadow', min: 0, max: 1, step: 0.01,
        fmt: v => `${Math.round(v * 100)}%` },
      { key: 'subjects', min: 1, max: 5, step: 1, mask: true,
        fmt: v => `${Math.round(v)}` },
      // The cut lives in the saliency map's own units. Otsu lands at about
      // 0.20 on a typical frame, so this nudges the cut around that point:
      // −0.06 admits a lot more background, +0.06 trims the subjects back.
      // Measured on the Ritz photo the whole ±0.06 range keeps all three
      // subjects and moves the kept area between 13% and 4% of the frame.
      { key: 'threshold', min: -0.06, max: 0.06, step: 0.005, mask: true,
        fmt: v => (v >= 0 ? '+' : '') + v.toFixed(3) },
      { key: 'centerWeight', min: 0, max: 1, step: 0.01, mask: true,
        fmt: v => v.toFixed(2) },
    ],
  },
};
// The selected filter. One at a time — the dropdown picks it.
let currentFilter = 'bloom';
// Each filter keeps its own parameter values, so switching back and forth
// does not throw away a tweak.
let params = {};
for (const key in FILTERS) params[key] = { ...FILTERS[key].defaults };
let sliders = {}, outputs = {};
let imageName = null;

// --- remembering the filter state -----------------------------------------
// Every filter's parameters, the selected filter and the on/off switch are
// kept in localStorage, so the lab comes back the way you left it — and each
// filter keeps its own settings as more of them arrive.
const STATE_KEY = 'magic-manos.state';
let stateTimer = 0;

function saveState() {
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        filter: currentFilter,
        on: onToggle.checked,
        params,
      }));
    } catch (e) {
      // No storage (private mode, quota): the app still works, it just forgets.
    }
  }, 150);
}

// Read the saved state back. Anything unknown or out of range is dropped, so
// a stale or hand-edited entry can never break the panel.
function restoreState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return; }
  if (!s || typeof s !== 'object') return;
  if (s.filter && FILTERS[s.filter]) currentFilter = s.filter;
  for (const key in FILTERS) {
    const def = FILTERS[key];
    const base = { ...def.defaults };
    const stored = s.params && s.params[key];
    if (stored && typeof stored === 'object') {
      for (const d of def.params) {
        const v = Number(stored[d.key]);
        if (Number.isFinite(v)) base[d.key] = Math.min(d.max, Math.max(d.min, v));
      }
    }
    params[key] = base;
  }
  if (typeof s.on === 'boolean') onToggle.checked = s.on;
}
restoreState();

// The filter that is selected right now.
const currentEntry = () => ({ key: currentFilter, def: FILTERS[currentFilter], p: params[currentFilter] });

// Machinery, not creative controls — fixed like the original script's σ=3.
// Sigma is a fraction of the kernel half-span (σ=3 over N=6 → 0.5).
const SPREAD = 0.5;
// Blur downsample factor, derived per render: smallest power of two that keeps
// the blur radius ≤ ~24px at downsampled res, so tap spacing stays ≤ ~1px and
// sparse-kernel ghosting can never appear — 1/2 for small radii, up to 1/16.
// The radius is in source pixels, so it is compared against 24 directly.
let dsFactor = 0;
const DS = radius =>
  Math.min(16, Math.max(2, 2 ** Math.ceil(Math.log2(Math.max(1, radius) / 24))));

const gl = canvas.getContext('webgl2', { premultipliedAlpha: false, preserveDrawingBuffer: true })
        || canvas.getContext('webgl',  { premultipliedAlpha: false, preserveDrawingBuffer: true });

if (!gl) {
  empty.innerHTML = 'WebGL is not available in this browser.';
  throw new Error('no webgl');
}

// uFlipY selects the UV mapping per pass. Browser-uploaded textures are
// row-0-top, so canvas output samples them flipped (uFlipY=1). FBO passes
// render unflipped (uFlipY=0), which makes FBO row 0 the image top as well —
// every texture then reads v=0 = top under one convention. This is all
// because UNPACK_FLIP_Y_WEBGL is not reliably honored for ImageBitmap sources.
const VERT = `
attribute vec2 aPos;
uniform float uFlipY;
varying vec2 vUV;
void main() {
  vUV = vec2(aPos.x * 0.5 + 0.5, 0.5 + aPos.y * 0.5 * (uFlipY > 0.5 ? -1.0 : 1.0));
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const PRELUDE = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
`;

// Copy/prefilter pass: plain copy when uThresh < 0, else per-channel soft knee
// max(c - t, 0). Run at the target's own size — with mipmapped sources the
// auto LOD gives an area downsample instead of a point sample.
const FRAG_PRE = PRELUDE + `
uniform sampler2D uTex;
uniform float uThresh;
void main() {
  vec4 c = texture2D(uTex, vUV);
  gl_FragColor = uThresh < 0.0 ? c : vec4(max(c.rgb - vec3(uThresh), vec3(0.0)), c.a);
}`;

// Separable gaussian, one axis per pass (uDir), taps spread across uRadiusPx
// in THIS texture's pixels — at downsampled res the spacing stays ≤ ~1px so
// there is no sparse-tap ghosting. A gaussian is exactly separable, so H+V
// equals the reference 2D kernel at a fraction of the cost.
const FRAG_BLUR = PRELUDE + `
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform vec2 uDir;
uniform float uRadiusPx;
uniform float uSigmaTaps;
void main() {
  const int N = 32;
  float twoSigma2 = 2.0 * uSigmaTaps * uSigmaTaps;
  vec4 sum = vec4(0.0);
  float total = 0.0;
  for (int i = -N; i <= N; i++) {
    float fi = float(i);
    float w = exp(-(fi * fi) / twoSigma2);
    vec2 o = vUV + uDir * ((fi / float(N)) * uRadiusPx) * uTexel;
    sum += texture2D(uTex, o) * w;
    total += w;
  }
  gl_FragColor = sum / total;
}`;

// Composite at full res: sharp layer at sharpAmt over the bilinear-upscaled
// soft layer, plus thresholded bloom × boost. The "upscale" is just LINEAR
// filtering on the small textures.
const FRAG_COMP = PRELUDE + `
uniform sampler2D uTex;
uniform sampler2D uSoft;
uniform sampler2D uBloom;
uniform float uSharp;
uniform float uBoost;
uniform float uOn;
void main() {
  vec4 sharp = texture2D(uTex, vUV);
  if (uOn < 0.5) { gl_FragColor = sharp; return; }
  vec4 outc = texture2D(uSoft, vUV) * (1.0 - uSharp) + sharp * uSharp;
  outc.rgb += texture2D(uBloom, vUV).rgb * uBoost;
  gl_FragColor = outc;
}`;

// Poppzz composite: the masked subject is magnified about its own centroid
// and laid over the untouched original, while the background is dimmed and
// desaturated. The mask is sampled at the *scaled* coordinate, so it grows
// with the object; the pivot map (dilated to the largest scale the slider
// allows) says which blob owns this pixel and where its centre is.
//
// The pivot map is sampled with linear filtering, so at a blob's edge the
// pivot channels and the validity flag are both ramped down towards zero —
// the pivot drifts towards (0,0) exactly where the silhouette is. They ramp
// together, so dividing one by the other puts the pivot back where it was.
const FRAG_POP = PRELUDE + `
uniform sampler2D uImg;
uniform sampler2D uMask;
uniform sampler2D uPivot;
uniform float uScale;
uniform float uDim;
uniform float uDesat;
uniform float uShadow;
uniform vec2 uShadowOffset;
void main() {
  vec2 uv = vUV;
  vec4 pv = texture2D(uPivot, uv);
  vec2 pivot = pv.gb / max(pv.a, 1e-3);   // undo the edge interpolation
  vec2 fgUV = pivot + (uv - pivot) / uScale;
  float a = texture2D(uMask, fgUV).r * pv.a;
  vec3 fg = texture2D(uImg, fgUV).rgb;
  vec3 bg = texture2D(uImg, uv).rgb;
  float lum = dot(bg, vec3(0.299, 0.587, 0.114));
  bg = mix(bg, vec3(lum), uDesat);
  bg *= (1.0 - uDim);
  // The background is dimmed everywhere, including under the subject — and
  // the enlarged subject's feathered edge then blends against a dimmed copy
  // of the subject's own edge pixels, which reads as a dark ring inside the
  // silhouette. Put the original pixels back under the unscaled mask.
  float a0 = texture2D(uMask, uv).r;
  bg = mix(bg, texture2D(uImg, uv).rgb, a0);
  // The shadow is the blurred mask, nudged off the subject and darkened.
  float sh = texture2D(uMask, uv + uShadowOffset).r;
  bg *= (1.0 - uShadow * sh * 0.55);
  gl_FragColor = vec4(mix(bg, fg, smoothstep(0.0, 1.0, a)), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const progPre = makeProgram(FRAG_PRE);
const progBlur = makeProgram(FRAG_BLUR);
const progComp = makeProgram(FRAG_COMP);
const progPop = makeProgram(FRAG_POP);

// Enumerate each program's uniforms once; lookups return null for anything the
// compiler dropped, which uniform*() calls then harmlessly ignore.
const UL = new Map();
for (const p of [progPre, progBlur, progComp, progPop]) {
  const m = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const u = gl.getActiveUniform(p, i);
    m[u.name] = gl.getUniformLocation(p, u.name);
  }
  UL.set(p, m);
}

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const isGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
const texFull = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texFull);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
// Mipmapped when WebGL2 allows it on this NPOT source: the downsample passes
// then get true area filtering for free. WebGL1 falls back to plain bilinear
// (slightly aliased downsample — acceptable, the blur hides it).
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, isGL2 ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);

let imgW = 0, imgH = 0, dsW = 0, dsH = 0, rafQueued = false;
const px = new Uint8Array(4);
let T = null; // thr (full res), soft/bloom/tmp (ds res)

function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo };
}

function allocTargets() {
  if (!imgW) return;
  if (T) for (const k in T) { gl.deleteTexture(T[k].tex); gl.deleteFramebuffer(T[k].fbo); }
  dsW = Math.max(1, Math.round(imgW / dsFactor));
  dsH = Math.max(1, Math.round(imgH / dsFactor));
  T = {
    thr:   makeTarget(imgW, imgH),
    soft:  makeTarget(dsW, dsH),
    bloom: makeTarget(dsW, dsH),
    tmp:   makeTarget(dsW, dsH),
  };
}

function bindTex(unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}

function pass(prog, target, w, h, setup) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog);
  const m = UL.get(prog);
  setup(n => m[n] || null);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// The downscaled copy the saliency pipeline works on. The copy is sized to
// the picture: a third of the long edge, clamped. Saliency does not need full
// resolution, but the mask *is* the silhouette the user sees, and a mask
// scaled up from 256px shows its texels as facets along the edge.
function prepareMask(src, w, h) {
  const long = Math.max(w, h);
  const edge = Math.min(MASK_MAX_EDGE, Math.max(MASK_MIN_EDGE, Math.round(long / 3)));
  const s = Math.min(1, edge / long);
  const mw = Math.max(8, Math.round(w * s)), mh = Math.max(8, Math.round(h * s));
  const c = document.createElement('canvas');
  c.width = mw; c.height = mh;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0, mw, mh);
  maskSrc = { data: x.getImageData(0, 0, mw, mh).data, w: mw, h: mh };
  allocMaskTargets(mw, mh);
  maskReady = false;
  // The mask is only worth building for the filter that uses it.
  if (currentFilter === 'poppzz') rebuildMask();
}

// Build the mask if it is not there yet — called when poppzz is selected or
// switched on, so a Bloom session never pays for the saliency pipeline.
function ensureMask() {
  if (maskSrc && !maskReady) rebuildMask();
}

// A mask slider moved: rebuild once the user stops dragging.
function scheduleMaskRebuild() {
  clearTimeout(maskTimer);
  maskTimer = setTimeout(() => { rebuildMask(); scheduleRender(); }, 200);
}

function uploadSource(src, w, h) {
  imgW = w; imgH = h;
  canvas.width = w; canvas.height = h;
  gl.bindTexture(gl.TEXTURE_2D, texFull);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  if (isGL2) gl.generateMipmap(gl.TEXTURE_2D);
  dsFactor = DS(params[currentFilter].radius ?? 0);
  allocTargets();
  prepareMask(src, w, h);
  empty.hidden = true;
  canvas.hidden = false;
  $('save').disabled = false;
  $('forget').hidden = false;
  $('dims').textContent = `${imgW} × ${imgH}`;
  syncOutputs();
  render();
}

// Run the selected filter over `src` and write the result to `dst`
// (null = screen). The bloom pass order is unchanged: threshold at full res
// so speculars of any size survive the downsample, copy the source for the
// soft layer, blur both, composite.
function applyFilter(src, dst, entry) {
  const p = entry.p;
  pass(progPre, T.thr, imgW, imgH, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform1f(L('uThresh'), p.thresh);
    bindTex(0, src);
  });
  // T.thr downsamples with plain bilinear — it is about to be blurred anyway,
  // so a per-frame mip chain here is pure cost (~20ms measured).
  pass(progPre, T.soft, dsW, dsH, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform1f(L('uThresh'), -1);
    bindTex(0, src);
  });
  pass(progPre, T.bloom, dsW, dsH, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform1f(L('uThresh'), -1);
    bindTex(0, T.thr.tex);
  });
  const rds = p.radius / dsFactor;
  const st = SPREAD * 32;
  for (const t of [T.soft, T.bloom]) {
    pass(progBlur, T.tmp, dsW, dsH, L => {
      gl.uniform1f(L('uFlipY'), 0); gl.uniform2f(L('uTexel'), 1 / dsW, 1 / dsH);
      gl.uniform2f(L('uDir'), 1, 0); gl.uniform1f(L('uRadiusPx'), rds); gl.uniform1f(L('uSigmaTaps'), st);
      bindTex(0, t.tex);
    });
    pass(progBlur, t, dsW, dsH, L => {
      gl.uniform1f(L('uFlipY'), 0); gl.uniform2f(L('uTexel'), 1 / dsW, 1 / dsH);
      gl.uniform2f(L('uDir'), 0, 1); gl.uniform1f(L('uRadiusPx'), rds); gl.uniform1f(L('uSigmaTaps'), st);
      bindTex(0, T.tmp.tex);
    });
  }
  pass(progComp, dst, imgW, imgH, L => {
    gl.uniform1f(L('uFlipY'), dst ? 0 : 1);
    gl.uniform1f(L('uSharp'), p.sharp);
    gl.uniform1f(L('uBoost'), p.boost);
    gl.uniform1f(L('uOn'), 1);
    gl.uniform1i(L('uTex'), 0); gl.uniform1i(L('uSoft'), 1); gl.uniform1i(L('uBloom'), 2);
    bindTex(0, src); bindTex(1, T.soft.tex); bindTex(2, T.bloom.tex);
  });
}

// A filter's `kind` picks its renderer. A new look with its own pipeline
// gets a function here; everything else is wired to the bloom renderer.
const RENDERERS = { bloom: applyFilter };

// --- poppzz: the saliency pipeline ----------------------------------------
//
// The subject is found on a small copy of the frame with classical saliency:
// colour rarity, colour contrast against the frame and against its edges, and
// a gentle centre prior. The product is thresholded with Otsu, cleaned up
// morphologically, split into connected components, and the stray specks are
// dropped. It is deterministic, needs no model and no dependency, and costs
// about a tenth of a second — so the mask is built once per image and the
// sliders stay live at 60fps.

const MASK_MIN_EDGE = 256;   // saliency does not need less than this
const MASK_MAX_EDGE = 640;   // ...nor more: the mask is upsampled by the GPU
const MASK_MIN_SIGMA = 1.2;  // texels — the anti-alias floor on the edge
const MASK_BLUR_PX = 18;     // source pixels — the blur the saliency sees
const MIN_BLOB_FRACTION = 0.015;  // drop specks below this share of the frame
const MAX_SCALE = 1.10;       // the pivot map is dilated for the largest scale

// How the four saliency terms share the combination.
//
// These are exponents on a PRODUCT, not weights on a mean — and that is the
// whole trick.
//
// A weighted geometric mean (the weights summing to 1) smooths the map into
// a single hump. Otsu then cuts that hump in half and calls half of the
// photograph a subject: measured on the Ritz photo, the mean gave a cut of
// 0.4706 with 33% of the frame kept and none of the three subjects isolated.
//
// A product keeps the map bimodal — background mass down near zero, subjects
// up at the top — which is the shape Otsu is built to split. The exponents
// sum to 4, the number of terms, so the map keeps a product's shape while
// the ratios say what counts for more: rarity and the centre prior weigh
// more than the two contrast terms.
//
// The floor is what makes the combination forgiving. One term at exactly
// zero would otherwise annihilate the pixel, and a pale grey-blue kurta
// against a stone wall is very nearly zero on the border term. The floor
// lifts every term off zero before it is raised to its power.
const W_RARE = 1.2, W_COLOR = 0.8, W_BORDER = 0.8, W_PRIOR = 1.2;
const TERM_FLOOR = 0.05;  // no term may sit at zero before it is powered

// A blob has to be solid to be a subject. A hedge is lacework — it fills
// its bounding box in a scatter, not a shape — and a tree canopy is the
// same. Below this fill ratio a blob is background, whatever its saliency.
const MIN_FILL = 0.30;
// A blob that runs off the edge of the frame is background: it was never a
// whole object in the first place. Its score is halved, not discarded —
// sometimes the subject really does touch the edge.
const EDGE_PENALTY = 0.5;

let maskSrc = null;      // the downscaled frame: {data, w, h}
let maskTex = null;      // RGBA: R = mask, G/B = pivot (u,v), A = pivot valid
let maskOut = null, maskTmp = null;  // blur targets for the mask
let maskReady = false;
let maskTimer = 0;
let maskMs = 0;          // how long the saliency pipeline took

// sRGB → linear, tabulated once.
const LIN_LUT = new Float32Array(256);
for (let i = 0; i < 256; i++) {
  const c = i / 255;
  LIN_LUT[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
const labF = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);

// sRGB → CIE Lab (D65), written into `out`.
//
// The caller passes one array in and reads it straight back: allocating a
// fresh three-element array per pixel was 300k little allocations at 640px,
// and the garbage they left behind showed up as pauses in the mask build.
function rgbToLab(r, g, b, out) {
  const R = LIN_LUT[r], G = LIN_LUT[g], B = LIN_LUT[b];
  const X = (R * 0.4124564 + G * 0.3575761 + B * 0.1804375) / 0.95047;
  const Y = (R * 0.2126729 + G * 0.7151522 + B * 0.0721750);
  const Z = (R * 0.0193339 + G * 0.1191920 + B * 0.9503041) / 1.08883;
  const fx = labF(X), fy = labF(Y), fz = labF(Z);
  out[0] = 116 * fy - 16;
  out[1] = 500 * (fx - fy);
  out[2] = 200 * (fy - fz);
  return out;
}

// A separable blur on a float plane, as three box passes.
//
// A gaussian would do, but its cost grows with the radius and the radius
// grows with the mask resolution — three gaussian planes came to 150ms at
// 640px. A box pass is a running sum, so it costs the same whatever the
// radius, and three of them are close enough to a gaussian for a map that
// only has to say "distinct" or "not".
function blurPlane(src, w, h, sigma) {
  const r = Math.max(1, Math.round(sigma));
  const inv = 1 / (2 * r + 1);
  let a = Float32Array.from(src);
  const b = new Float32Array(w * h);
  // Named `round`, not `pass`: `pass` is the name of the global draw helper
  // further down, and shadowing it here is the kind of thing that breaks
  // silently later.
  for (let round = 0; round < 3; round++) {
    // horizontal, running sum, edges clamped
    for (let y = 0; y < h; y++) {
      const row = y * w;
      let sum = 0;
      for (let i = -r; i <= r; i++) sum += a[row + (i < 0 ? 0 : i >= w ? w - 1 : i)];
      for (let x = 0; x < w; x++) {
        b[row + x] = sum * inv;
        const out = x - r, inn = x + r + 1;
        sum += (inn < w ? a[row + inn] : a[row + w - 1]) - (out >= 0 ? a[row + out] : a[row]);
      }
    }
    // vertical, same trick
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let i = -r; i <= r; i++) sum += b[(i < 0 ? 0 : i >= h ? h - 1 : i) * w + x];
      for (let y = 0; y < h; y++) {
        a[y * w + x] = sum * inv;
        const out = y - r, inn = y + r + 1;
        sum += (inn < h ? b[inn * w + x] : b[(h - 1) * w + x]) - (out >= 0 ? b[out * w + x] : b[x]);
      }
    }
  }
  return a;
}

// Min or max over a 3×3 box — the structuring element for the morphology.
function morph(src, w, h, op) {
  const pick = op === 'max' ? Math.max : Math.min;
  const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let v = src[y * w + x];
      if (x > 0) v = pick(v, src[y * w + x - 1]);
      if (x < w - 1) v = pick(v, src[y * w + x + 1]);
      tmp[y * w + x] = v;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let v = tmp[y * w + x];
      if (y > 0) v = pick(v, tmp[(y - 1) * w + x]);
      if (y < h - 1) v = pick(v, tmp[(y + 1) * w + x]);
      out[y * w + x] = v;
    }
  }
  return out;
}

// Otsu's threshold: the point that splits the histogram with the most
// between-class variance. Deterministic, and needs no tuning.
//
// The bin count matters here. The saliency map is a product, so most of its
// mass sits near zero; at 256 bins that mass is crushed into the first few
// and the cut lands on a coarse step. 1024 bins resolve it.
function otsuThreshold(vals, n, bins = 1024) {
  const hist = new Float64Array(bins);
  const scale = bins - 1;
  for (let i = 0; i < n; i++) {
    let b = Math.round(vals[i] * scale);
    if (b < 0) b = 0; else if (b > scale) b = scale;
    hist[b]++;
  }
  let total = 0, sum = 0;
  for (let i = 0; i < bins; i++) { total += hist[i]; sum += i * hist[i]; }
  let sumB = 0, wB = 0, best = 0, bestVar = -1;
  for (let t = 0; t < bins; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > bestVar) { bestVar = v; best = t; }
  }
  return best / scale;
}

// Connected components (8-connectivity) over the binary mask, each with its
// area and a saliency-weighted centroid.
function labelBlobs(bin, w, h, sal) {
  const labels = new Int32Array(w * h).fill(-1);
  const blobs = [];
  const stack = [];
  for (let start = 0; start < w * h; start++) {
    if (!bin[start] || labels[start] >= 0) continue;
    const id = blobs.length;
    labels[start] = id;
    stack.length = 0; stack.push(start);
    let area = 0, s = 0, sx = 0, sy = 0;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    while (stack.length) {
      const p = stack.pop();
      const x = p % w, y = (p / w) | 0;
      const v = sal[p];
      area++; s += v; sx += x * v; sy += y * v;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const q = ny * w + nx;
          if (bin[q] && labels[q] < 0) { labels[q] = id; stack.push(q); }
        }
      }
    }
    blobs.push({ id, area, sal: s, cx: s ? sx / s : x0, cy: s ? sy / s : y0, x0, y0, x1, y1 });
  }
  return { blobs, labels };
}

// A plane normalised to 0…1 — every map below is compared against its own
// extremes, so a photo that is mostly one colour does not skew the rest.
function normalizePlane(v) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < v.length; i++) {
    if (v[i] < lo) lo = v[i];
    if (v[i] > hi) hi = v[i];
  }
  const range = hi - lo || 1;
  const out = new Float32Array(v.length);
  for (let i = 0; i < v.length; i++) out[i] = (v[i] - lo) / range;
  return out;
}

// Colour rarity: how unusual this pixel's colour is in the frame. A Lab
// histogram is built over the whole picture, smoothed, and a pixel scores
// high when the colours around it are rare — the yellow of a shrine, the
// red of a sari. Common colours (sky, foliage, pavement) score low.
//
// Rarity is what makes the mask a *shape* rather than a set of edges: it
// holds across the whole interior of a flat-coloured object.
function colourRarity(L, A, B, w, h) {
  const n = w * h;
  const binL = 16, binA = 16, binB = 16;
  const hist = new Float64Array(binL * binA * binB);
  const at = i => {
    const l = Math.min(binL - 1, Math.max(0, Math.floor(L[i] / 100 * binL)));
    const a = Math.min(binA - 1, Math.max(0, Math.floor((A[i] + 100) / 200 * binA)));
    const b = Math.min(binB - 1, Math.max(0, Math.floor((B[i] + 100) / 200 * binB)));
    return (l * binA + a) * binB + b;
  };
  for (let i = 0; i < n; i++) hist[at(i)]++;
  // Smooth the histogram so a colour that merely straddles a bin boundary
  // does not look rare.
  const sm = new Float64Array(hist.length);
  for (let l = 0; l < binL; l++) {
    for (let a = 0; a < binA; a++) {
      for (let b = 0; b < binB; b++) {
        let sum = 0, count = 0;
        for (let dl = -1; dl <= 1; dl++) {
          for (let da = -1; da <= 1; da++) {
            for (let db = -1; db <= 1; db++) {
              const ll = l + dl, aa = a + da, bb = b + db;
              if (ll < 0 || aa < 0 || bb < 0 || ll >= binL || aa >= binA || bb >= binB) continue;
              sum += hist[(ll * binA + aa) * binB + bb]; count++;
            }
          }
        }
        sm[(l * binA + a) * binB + b] = sum / count;
      }
    }
  }
  let peak = 0;
  for (const v of sm) if (v > peak) peak = v;
  const rare = new Float32Array(n);
  for (let i = 0; i < n; i++) rare[i] = 1 - sm[at(i)] / (peak || 1);
  return normalizePlane(rare);
}

// The saliency map: rarity, colour contrast, border contrast and the centre
// prior, combined as a product of powers.
//
// The three distinctness terms all measure the same idea from different
// angles — a subject is a colour that is rare in the frame, unlike the
// frame's average colour, and unlike the colours along the edges. Taken
// together they are what kills the foliage and the pavement: both are
// common, and both sit close to the background.
//
// A gradient/detail term was tried here first and dropped: detail only fires
// on edges, so the mask came out as fragments of outlines instead of whole
// subjects.
function computeSaliency(data, w, h, centerWeight, sigma) {
  const n = w * h;
  const L = new Float32Array(n), A = new Float32Array(n), B = new Float32Array(n);
  const lab = new Float32Array(3);
  let mL = 0, mA = 0, mB = 0;
  for (let i = 0; i < n; i++) {
    rgbToLab(data[i * 4], data[i * 4 + 1], data[i * 4 + 2], lab);
    L[i] = lab[0]; A[i] = lab[1]; B[i] = lab[2];
    mL += lab[0]; mA += lab[1]; mB += lab[2];
  }
  mL /= n; mA /= n; mB /= n;

  // Colour contrast: the distance between a lightly blurred pixel and the
  // frame's mean Lab. The blur is measured in *source* pixels, so the map
  // comes out the same whether the mask copy is 256px or 640px — in texels
  // alone it would be a much tighter blur at the higher resolution, and the
  // subject's own texture would cut it into pieces.
  const Lb = blurPlane(L, w, h, sigma);
  const Ab = blurPlane(A, w, h, sigma);
  const Bb = blurPlane(B, w, h, sigma);
  const colorRaw = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const dL = Lb[i] - mL, dA = Ab[i] - mA, dB = Bb[i] - mB;
    colorRaw[i] = Math.sqrt(dL * dL + dA * dA + dB * dB);
  }
  const color = normalizePlane(colorRaw);

  // Border contrast: the same distance, but against the colours along the
  // edge of the frame. The edge is where the background usually is, so this
  // separates a subject from its surroundings even when the whole frame
  // shares one colour.
  const ring = Math.max(2, Math.round(Math.min(w, h) * 0.07));
  let bL = 0, bA = 0, bB = 0, bn = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (x >= ring && x < w - ring && y >= ring && y < h - ring) continue;
      const i = y * w + x;
      bL += L[i]; bA += A[i]; bB += B[i]; bn++;
    }
  }
  bL /= bn; bA /= bn; bB /= bn;
  const borderRaw = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const dL = Lb[i] - bL, dA = Ab[i] - bA, dB = Bb[i] - bB;
    borderRaw[i] = Math.sqrt(dL * dL + dA * dA + dB * dB);
  }
  const border = normalizePlane(borderRaw);

  const rare = colourRarity(L, A, B, w, h);

  // Centre prior: a wide gaussian, so border clutter does not win outright.
  const cx = w / 2, cy = h / 2, cSigma = 0.5 * Math.max(w, h);

  // The four terms, each raised to its power, multiplied together.
  //
  // The powers are tabulated: four Math.pow calls per pixel is 1.2 million
  // calls at 640px, and this runs on every mask rebuild.
  const lutR = powLUT(W_RARE), lutC = powLUT(W_COLOR);
  const lutB = powLUT(W_BORDER), lutP = powLUT(W_PRIOR);
  const S = new Float32Array(n);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const dx = x - cx, dy = y - cy;
      const center = Math.exp(-(dx * dx + dy * dy) / (2 * cSigma * cSigma));
      const prior = (1 - centerWeight) + centerWeight * center;
      S[i] = lutLookup(lutR, rare[i] + TERM_FLOOR)
           * lutLookup(lutC, color[i] + TERM_FLOOR)
           * lutLookup(lutB, border[i] + TERM_FLOOR)
           * lutLookup(lutP, prior);
    }
  }
  return S;
}

// x^e for x in 0…1, tabulated. The table is 1024 wide, so the largest error
// is a fraction of a percent of the value — well under a pixel's worth of
// saliency.
function powLUT(e, size = 1024) {
  const lut = new Float32Array(size);
  for (let i = 0; i < size; i++) lut[i] = Math.pow(i / (size - 1), e);
  return lut;
}
function lutLookup(lut, v) {
  const x = v < 0 ? 0 : v > 1 ? 1 : v;
  return lut[(x * (lut.length - 1) + 0.5) | 0];
}

// --- the mask, from the saliency map to the GPU ---------------------------

function allocMaskTargets(w, h) {
  for (const t of [maskTex, maskOut, maskTmp]) {
    if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
  }
  maskTex = makeTarget(w, h);
  maskOut = makeTarget(w, h);
  maskTmp = makeTarget(w, h);
}

// How good a candidate subject a blob is.
//
// Ranking by total saliency is what let the hedges and trees win: they are
// big, so their saliency adds up, even though each part of them is only
// moderately salient. Two things cut against that — how solid the blob is
// (a hedge is a lacework, a subject is a shape), and whether it runs off the
// edge of the frame (a blob that does was never a whole object).
//
// The solidity test is a filter rather than a score, though. Multiplying the
// score by the fill ratio was tried and it demotes a big, real subject — the
// sari in the foreground of the Ritz photo — below a small solid one: the
// fill ratio says how much of the bounding box the blob fills, and a person
// fills less of theirs than a bench does.
function blobFill(b) {
  return b.area / ((b.x1 - b.x0 + 1) * (b.y1 - b.y0 + 1));
}
function blobScore(b, w, h) {
  const edge = (b.x0 === 0 || b.y0 === 0 || b.x1 === w - 1 || b.y1 === h - 1)
    ? EDGE_PENALTY : 1;
  return b.sal * edge;
}

// Rebuild the mask from the downscaled frame. Called once per image, and
// again whenever a slider that changes the mask itself moves.
function rebuildMask() {
  if (!maskSrc) return;
  const t0 = performance.now();
  const { data, w, h } = maskSrc;
  const cfg = params.poppzz;
  // The saliency's blur is measured in source pixels, so it means the same
  // thing whatever size the mask copy is.
  const sigma = Math.max(1, MASK_BLUR_PX * maskSrc.w / imgW);
  const S = computeSaliency(data, w, h, cfg.centerWeight, sigma);

  // Otsu, with the bias slider nudging the cut.
  //
  // The cut lands in the map's own units. The map is a product, so its mass
  // is piled up near zero with the subjects standing clear above it — that
  // is the shape Otsu splits. A root before the threshold would pull the
  // near-zero background mass UP towards the subjects and destroy the
  // separation: measured, Math.pow(S, 0.25) moved the cut to 0.4627 and
  // turned the whole photograph into one blob. What the crowded histogram
  // needed was more bins, not a different scale: 1024 bins resolve the low
  // end that 256 bins crush into their first few.
  const t = Math.max(0, Math.min(1, otsuThreshold(S, w * h, 1024) + cfg.threshold));
  let bin = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) bin[i] = S[i] > t ? 1 : 0;
  // Close (dilate then erode), then open (erode then dilate): fills holes and
  // clears the ragged edge the threshold leaves behind. The close runs twice
  // so that parts of a subject separated by a few pixels join up.
  bin = morph(morph(bin, w, h, 'max'), w, h, 'min');
  bin = morph(morph(bin, w, h, 'max'), w, h, 'min');
  bin = morph(morph(bin, w, h, 'min'), w, h, 'max');

  const { blobs, labels } = labelBlobs(bin, w, h, S);
  // Drop the specks — the birds, the bright buttons. A blob must clear the
  // frame-share floor, and also stay in proportion to the biggest subject so
  // a second, smaller subject is not thrown away with the specks.
  const minArea = MIN_BLOB_FRACTION * w * h;
  const biggest = blobs.reduce((m, b) => Math.max(m, b.area), 0);
  let eligible = blobs.filter(b => b.area >= minArea || b.area >= biggest * 0.2);
  // ...and drop the lacework. A hedge or a tree canopy fills its bounding
  // box in a scatter rather than a shape; a subject is solid. If that leaves
  // nothing at all, the photo has no solid subject and the unfiltered set is
  // better than an empty mask.
  const solid = eligible.filter(b => blobFill(b) >= MIN_FILL);
  if (solid.length) eligible = solid;
  const kept = eligible
    .sort((a, b) => blobScore(b, w, h) - blobScore(a, w, h))
    .slice(0, Math.max(1, Math.round(cfg.subjects)));

  const px = new Uint8Array(w * h * 4);
  for (const b of kept) {
    for (let y = b.y0; y <= b.y1; y++) {
      for (let x = b.x0; x <= b.x1; x++) {
        const i = y * w + x;
        if (labels[i] === b.id) px[i * 4] = 255;
      }
    }
  }
  // The pivot map: for every pixel of the subject's footprint, the centre of
  // the blob it belongs to. Inverse warp the footprint back onto the mask to
  // find out which blob it is.
  //
  // The warp has to be done at more than one scale. At the largest scale
  // alone, a pixel of a concave subject — under the lady's outstretched arm,
  // between the cenotaph's spires — warps outside the blob and never gets a
  // pivot, so it drops back to the dimmed background and the subject comes
  // out with a hole in it. Warping at 1 stamps the subject's own pixels, and
  // the steps in between fill the gap up to the largest scale.
  for (const b of kept) {
    const pu = Math.round(b.cx / w * 255);
    const pv = Math.round(b.cy / h * 255);
    for (const s of [1, 1 + (MAX_SCALE - 1) / 2, MAX_SCALE]) {
      // The footprint at scale s is the blob's box grown about its centre.
      const ox0 = Math.max(0, Math.floor(b.cx - (b.cx - b.x0) * s));
      const ox1 = Math.min(w - 1, Math.ceil(b.cx + (b.x1 - b.cx) * s));
      const oy0 = Math.max(0, Math.floor(b.cy - (b.cy - b.y0) * s));
      const oy1 = Math.min(h - 1, Math.ceil(b.cy + (b.y1 - b.cy) * s));
      for (let y = oy0; y <= oy1; y++) {
        for (let x = ox0; x <= ox1; x++) {
          const i = y * w + x;
          if (px[i * 4 + 3]) continue;        // already has a pivot
          const sx = b.cx + (x - b.cx) / s;
          const sy = b.cy + (y - b.cy) / s;
          const ix = Math.round(sx), iy = Math.round(sy);
          if (ix < 0 || iy < 0 || ix >= w || iy >= h) continue;
          if (labels[iy * w + ix] !== b.id) continue;
          px[i * 4 + 1] = pu;
          px[i * 4 + 2] = pv;
          px[i * 4 + 3] = 255;   // this pixel has a pivot
        }
      }
    }
  }

  gl.bindTexture(gl.TEXTURE_2D, maskTex.tex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  maskReady = true;
  maskMs = performance.now() - t0;
}

// The mask's own blur — the feather on the boundary. Radius is given in image
// pixels, so it is converted into the mask texture's own texels. The blur
// also has a floor: the mask is a binary image, and without a texel or two
// of blur its edges show the texel grid as facets when the GPU scales it up.
function blurMask(featherPx) {
  const rds = Math.max(MASK_MIN_SIGMA / SPREAD, featherPx * maskSrc.w / imgW);
  const st = SPREAD * 32;
  pass(progBlur, maskTmp, maskSrc.w, maskSrc.h, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform2f(L('uTexel'), 1 / maskSrc.w, 1 / maskSrc.h);
    gl.uniform2f(L('uDir'), 1, 0); gl.uniform1f(L('uRadiusPx'), rds); gl.uniform1f(L('uSigmaTaps'), st);
    bindTex(0, maskTex.tex);
  });
  pass(progBlur, maskOut, maskSrc.w, maskSrc.h, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform2f(L('uTexel'), 1 / maskSrc.w, 1 / maskSrc.h);
    gl.uniform2f(L('uDir'), 0, 1); gl.uniform1f(L('uRadiusPx'), rds); gl.uniform1f(L('uSigmaTaps'), st);
    bindTex(0, maskTmp.tex);
  });
}

function applyPoppzz(src, dst, entry) {
  const p = entry.p;
  if (!maskReady) {
    // No mask yet — show the source untouched.
    pass(progComp, dst, imgW, imgH, L => {
      gl.uniform1f(L('uFlipY'), dst ? 0 : 1);
      gl.uniform1f(L('uSharp'), 1);
      gl.uniform1f(L('uBoost'), 0);
      gl.uniform1f(L('uOn'), 0);
      gl.uniform1i(L('uTex'), 0); gl.uniform1i(L('uSoft'), 1); gl.uniform1i(L('uBloom'), 2);
      bindTex(0, src); bindTex(1, T.soft.tex); bindTex(2, T.bloom.tex);
    });
    return;
  }
  blurMask(p.feather);
  pass(progPop, dst, imgW, imgH, L => {
    gl.uniform1f(L('uFlipY'), dst ? 0 : 1);
    gl.uniform1f(L('uScale'), p.scale);
    gl.uniform1f(L('uDim'), p.bgDim);
    gl.uniform1f(L('uDesat'), p.bgDesat);
    gl.uniform1f(L('uShadow'), p.shadow);
    gl.uniform2f(L('uShadowOffset'), 0.0015, 0.0015);
    gl.uniform1i(L('uImg'), 0); gl.uniform1i(L('uMask'), 1); gl.uniform1i(L('uPivot'), 2);
    bindTex(0, src); bindTex(1, maskOut.tex); bindTex(2, maskTex.tex);
  });
}

RENDERERS.poppzz = applyPoppzz;

function render() {
  if (!imgW || !T) return;
  const t0 = performance.now();
  const on = onToggle.checked;
  const entry = currentEntry();
  const f = DS(entry.p.radius ?? 0);
  if (f !== dsFactor) { dsFactor = f; allocTargets(); }
  if (!on) {
    // Filter stage off: show the source pixels, untouched.
    pass(progComp, null, imgW, imgH, L => {
      gl.uniform1f(L('uFlipY'), 1);
      gl.uniform1f(L('uSharp'), 1);
      gl.uniform1f(L('uBoost'), 0);
      gl.uniform1f(L('uOn'), 0);
      gl.uniform1i(L('uTex'), 0); gl.uniform1i(L('uSoft'), 1); gl.uniform1i(L('uBloom'), 2);
      bindTex(0, texFull); bindTex(1, T.soft.tex); bindTex(2, T.bloom.tex);
    });
  } else {
    RENDERERS[entry.def.kind](texFull, null, entry);
  }
  // gl.finish() only flushes the command buffer on most browsers; a readback
  // is what actually syncs on GPU completion, so the ms figure stays honest.
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const ms = (performance.now() - t0).toFixed(1);
  const what = entry.def.kind === 'poppzz'
    ? `mask ${maskMs.toFixed(0)} ms`
    : `blur@1/${dsFactor}`;
  stat.textContent = `${on ? `${entry.def.name} · ${what} · ` : ''}render ${ms} ms`;
}

function scheduleRender() {
  if (rafQueued) return;
  rafQueued = true;
  requestAnimationFrame(() => { rafQueued = false; render(); });
}

async function loadFile(file) {
  imageName = file.name;
  rememberImage(file, file.name);
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    uploadSource(bmp, bmp.width, bmp.height);
    bmp.close();
  } catch {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { uploadSource(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); };
    img.src = url;
  }
}

// --- remembering the last image -------------------------------------------
// The picture is kept as a blob in IndexedDB: a 12MP JPEG is far past what
// localStorage will hold, and IndexedDB keeps it out of the URL.
const DB_NAME = 'magic-manos', DB_STORE = 'images', DB_KEY = 'last';
let dbPromise = null;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbPromise;
}

async function rememberImage(blob, name) {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put({ id: DB_KEY, name, blob, at: Date.now() });
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
    $('forget').hidden = false;
  } catch (e) {
    console.warn('could not remember the image:', e);
  }
}

async function recallImage() {
  try {
    const d = await db();
    const rec = await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readonly');
      const rq = tx.objectStore(DB_STORE).get(DB_KEY);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return rec && rec.blob ? rec : null;
  } catch (e) {
    console.warn('could not recall the image:', e);
    return null;
  }
}

async function forgetImage() {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(DB_KEY);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) {
    console.warn('could not forget the image:', e);
  }
  $('forget').hidden = true;
}

// Clear the image: drop the remembered copy and empty the stage.
async function clearImage() {
  await forgetImage();
  imgW = 0; imgH = 0;
  imageName = null;
  maskSrc = null;
  maskReady = false;
  canvas.hidden = true;
  empty.hidden = false;
  $('save').disabled = true;
  $('dims').textContent = '—';
  stat.textContent = 'no image';
}

// Bring back the last picture on the next visit.
(async function restoreLastImage() {
  const rec = await recallImage();
  if (!rec) return;
  imageName = rec.name;
  try {
    const bmp = await createImageBitmap(rec.blob, { imageOrientation: 'from-image' });
    uploadSource(bmp, bmp.width, bmp.height);
    bmp.close();
    $('forget').hidden = false;
  } catch (e) {
    console.warn('could not restore the image:', e);
  }
})();

function testPattern() {
  const w = 1440, h = 900, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#ffb066'); sky.addColorStop(.45, '#8a5f9e'); sky.addColorStop(1, '#1c1430');
  x.fillStyle = sky; x.fillRect(0, 0, w, h);
  const sun = x.createRadialGradient(w*.68, h*.42, 8, w*.68, h*.42, 170);
  sun.addColorStop(0, '#fff6dd'); sun.addColorStop(.25, '#ffd98a'); sun.addColorStop(1, '#ffd98a00');
  x.fillStyle = sun; x.fillRect(0, 0, w, h);
  x.fillStyle = '#171226';
  x.beginPath(); x.moveTo(0, h*.72);
  for (let i = 0; i <= 12; i++) x.lineTo(w * i / 12, h*.72 - Math.sin(i*1.7)*60 - 40);
  x.lineTo(w, h); x.lineTo(0, h); x.fill();
  x.fillStyle = '#0d0a18';
  x.fillRect(w*.08, h*.42, w*.3, h*.58);
  x.fillStyle = '#ffe9b0';
  for (let r = 0; r < 7; r++) for (let col = 0; col < 4; col++)
    if ((r + col) % 3) x.fillRect(w*.1 + col*w*.07, h*.46 + r*h*.075, w*.035, h*.038);
  const cols = ['#ff5470', '#3ec6ff', '#ffe066', '#7dff9b'];
  cols.forEach((col, i) => {
    x.fillStyle = col;
    x.beginPath(); x.arc(w*(.55 + i*.09), h*.8, 26, 0, 7); x.fill();
  });
  x.strokeStyle = '#ffffff'; x.lineWidth = 2;
  x.strokeRect(w*.86, h*.1, 90, 60);
  imageName = 'test-pattern';
  uploadSource(c, w, h);
  // The test pattern is remembered too — it is the picture that is loaded.
  c.toBlob(b => b && rememberImage(b, 'test-pattern'), 'image/png');
}

// --- wiring ---

$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
$('sample').addEventListener('click', testPattern);
$('forget').addEventListener('click', clearImage);
$('save').addEventListener('click', () => {
  render();
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `${currentFilter}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
});

// Download the selected filter + its params as versioned JSON — the timestamp
// is the version stamp of the recipe record.
$('settings').addEventListener('click', () => {
  const data = {
    version: new Date().toISOString(),
    app: 'magic-manos',
    filter: currentFilter,
    name: FILTERS[currentFilter].name,
    params: { ...params[currentFilter] },
    image: imageName,
    imageSize: imgW ? [imgW, imgH] : null,
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `magic-manos-${data.version.replace(/[:.]/g, '-')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

onToggle.addEventListener('change', () => {
  syncToggleUI();
  ensureMask();
  saveState();
  scheduleRender();
});

// The switch drives two things: whether the filter stage runs at all, and
// whether the panel reads as live or dimmed.
function syncToggleUI() {
  const on = onToggle.checked;
  stage.classList.toggle('on', on);
  side.classList.toggle('off', !on);
}

const fmt = (def, v) => def.fmt ? def.fmt(v) : v.toFixed(2);

// Build the filter section from the registry: the picker lists every filter,
// and the parameter rows below belong to the selected one — only the
// relevant ones, since each filter declares its own surface.
function buildControls() {
  // --- the picker is generated from the registry ---
  const sel = $('filter');
  sel.textContent = '';
  for (const [key, f] of Object.entries(FILTERS)) {
    const o = document.createElement('option');
    o.value = key; o.textContent = f.name;
    sel.append(o);
  }
  sel.value = currentFilter;

  // --- the selected filter's parameters ---
  const host = $('params');
  host.textContent = '';
  sliders = {}; outputs = {};
  const def = FILTERS[currentFilter];
  for (const d of def.params) {
    const row = document.createElement('div');
    row.className = 'prow';
    const head = document.createElement('div');
    head.className = 'head';
    const name = document.createElement('span');
    name.textContent = d.key;
    const out = document.createElement('output');
    out.textContent = fmt(d, params[currentFilter][d.key] ?? d.min);
    head.append(name, out);
    const input = document.createElement('input');
    input.type = 'range';
    input.id = `${currentFilter}-${d.key}`;
    input.min = d.min; input.max = d.max; input.step = d.step;
    input.value = params[currentFilter][d.key] ?? d.min;
    input.setAttribute('aria-label', `${def.name} ${d.key}`);
    row.append(head, input);
    host.append(row);
    sliders[d.key] = input;
    outputs[d.key] = out;
    input.addEventListener('input', () => {
      params[currentFilter][d.key] = parseFloat(input.value);
      out.textContent = fmt(d, params[currentFilter][d.key]);
      scheduleRender();
      saveState();
      // A mask slider changes the mask itself, not just the composite.
      if (d.mask) scheduleMaskRebuild();
    });
  }
  $('chip').textContent = def.name;
}

function syncOutputs() {
  const def = FILTERS[currentFilter];
  for (const d of def.params) {
    const out = outputs[d.key];
    if (out) out.textContent = fmt(d, params[currentFilter][d.key]);
  }
}

$('filter').addEventListener('change', e => {
  currentFilter = e.target.value;
  buildControls();
  ensureMask();
  saveState();
  scheduleRender();
});

$('reset').addEventListener('click', () => {
  params[currentFilter] = { ...FILTERS[currentFilter].defaults };
  for (const [k, el] of Object.entries(sliders)) {
    el.value = params[currentFilter][k];
    el.dispatchEvent(new Event('input'));
  }
  saveState();
});

buildControls();
// The saved state may have left the filter stage switched on.
syncToggleUI();

$('zoomseg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const s of b.parentElement.children) s.classList.toggle('on', s === b);
  stage.classList.toggle('z100', b.dataset.z === 'z100');
  stage.classList.toggle('fit', b.dataset.z !== 'z100');
});

for (const ev of ['dragenter', 'dragover'])
  stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); });
for (const ev of ['dragleave', 'drop'])
  stage.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget && stage.contains(e.relatedTarget)) return;
    stage.classList.remove('drag');
    if (ev === 'drop') e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]);
  });

addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement && e.target.type === 'file') return;
  if (e.key === 'f') { onToggle.checked = !onToggle.checked; onToggle.dispatchEvent(new Event('change')); }
  else if (e.key === 's' && !$('save').disabled) $('save').click();
  else if (e.key === '1') document.querySelector('[data-z="z100"]').click();
  else if (e.key === '0') document.querySelector('[data-z="fit"]').click();
});
</script>
