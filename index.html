<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magic-manos — filters</title>
<link rel="stylesheet" href="css/app.css">

<aside id="side" class="side off">
  <div>
    <div class="logo">
      <span class="word">magic<span class="sep">–</span><b>manos</b></span>
    </div>
    <div class="tag">photographic filter lab</div>
  </div>

  <section class="panel image-panel">
    <div class="panel-head"><span class="label">Image</span></div>
    <div class="panel-body">
      <label class="btn">Choose image<input id="file" class="visually-hidden" type="file" accept="image/*"></label>
      <button id="sample" class="btn">Load Test pattern</button>
      <button id="forget" class="btn ghost" hidden>Clear image</button>
      <div class="row">
        <span class="mini">Dimensions</span>
        <span id="dims" class="dim">—</span>
      </div>
      <div class="row">
        <span class="mini">Zoom</span>
        <div class="seg" id="zoomseg"><button data-z="fit" class="on">Fit</button><button data-z="z100">100%</button></div>
      </div>
    </div>
  </section>

  <section class="panel filter-panel">
    <div class="panel-head">
      <span class="label">Filter</span>
      <label class="toggle" title="Filter on/off">
        <input id="on" type="checkbox" aria-label="Filter on/off">
        <span class="sw"></span>
      </label>
    </div>
    <div class="panel-body">
      <select id="filter" aria-label="Filter"></select>
      <div id="params"></div>
      <button id="reset" class="btn ghost">reset</button>
    </div>
  </section>

  <section class="panel export-panel">
    <div class="panel-head"><span class="label">Export</span></div>
    <div class="panel-body">
      <button id="save" class="btn" disabled>Save PNG</button>
      <button id="settings" class="btn">Settings ↓</button>
    </div>
  </section>

  <div class="side-foot">
    <div id="stat" class="dim">no image</div>
    <div class="keys"><kbd>f</kbd> filter · <kbd>s</kbd> save · <kbd>1</kbd>/<kbd>0</kbd> zoom</div>
  </div>
</aside>
<main id="stage" class="fit">
  <div id="empty">
    Drop an image here, choose a file, or press “Load Test pattern”.<br>
    <span class="dim">Your last image comes back on its own — until then, these are untouched source pixels.</span>
  </div>
  <canvas id="gl" hidden></canvas>
  <span id="chip"></span>
</main>

<script type="module" src="dist/app.js"></script>
