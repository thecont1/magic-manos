<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magic-manos — filters</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: row;
    background: #101012; color: #d8d6d0;
    font: 13px/1.45 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    overflow: hidden;
  }

  /* Left sidebar holds every control; the stage keeps the rest of the
     window — width for the image, height for the picture. */
  #side {
    flex: 0 0 264px; width: 264px;
    border-right: 1px solid #26262a;
    background: #131315;
    padding: 12px 13px 14px;
    display: flex; flex-direction: column; gap: 13px;
    overflow-y: auto;
  }
  /* ---- logo ------------------------------------------------------- */
  .logo { display: flex; align-items: baseline; }
  .logo .word {
    font-size: 19px; line-height: 1; color: #a8a6ae;
    letter-spacing: -.012em; text-shadow: 0 0 22px #ffb45e1f;
  }
  .logo .word b { font-weight: 600; color: #f4f1ea; }
  .logo .sep { color: #ffb45e; font-weight: 300; margin: 0 2px; }
  .tag { color: #6a6970; font-size: 11px; letter-spacing: .04em; }

  .dim { color: #77767d; }
  strong { font-weight: 600; letter-spacing: .01em; }

  /* ---- panels ------------------------------------------------------ */
  /* Each section is a panel with a tab bar on top: the bar carries the
     title, its top corners are square, and the body sits below it with room
     to breathe. The panel keeps a full border, top edge included. */
  .panel {
    border: 1px solid #26262a;
    border-radius: 0 0 10px 10px;
    background: #161619; padding: 0 12px 12px;
    display: flex; flex-direction: column;
  }
  /* The filter section is the point of the app — it gets the accent. */
  .panel.filter-panel {
    border-color: #4a3d28;
    background: #1a1814;
  }
  .panel-head {
    margin: 0 -12px;
    padding: 8px 12px 9px;
    background: #1e1e22;
    border-bottom: 1px solid #26262a;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .filter-panel .panel-head {
    background: linear-gradient(180deg, #2c2215, #1d1a16);
    border-bottom-color: #4a3d28;
  }
  .panel-head .label {
    font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: #8a8890;
  }
  .filter-panel .panel-head .label { color: #ffb45e; }
  .panel-body { display: flex; flex-direction: column; gap: 9px; padding-top: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row .mini { font-size: 11px; color: #8a8890; }

  .btn {
    appearance: none; border: 1px solid #3a3a40; border-radius: 6px;
    background: #1b1b1f; color: #d8d6d0; padding: 6px 11px;
    font: inherit; cursor: pointer; user-select: none; text-align: center;
  }
  .btn:hover { border-color: #55555e; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; padding: 4px 8px; }
  .btn.on { background: #2c2c33; color: #f0eee8; border-color: #55555e; }

  /* On/off switch — the filter's master gate. */
  .toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle .sw {
    position: relative; flex: 0 0 auto;
    width: 34px; height: 19px; border-radius: 999px;
    border: 1px solid #3a3a40; background: #1b1b1f; transition: all .15s;
  }
  .toggle .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 13px; height: 13px; border-radius: 50%;
    background: #6b6a72; transition: all .15s;
  }
  .toggle input:checked + .sw { background: #ffb45e26; border-color: #ffb45e; }
  .toggle input:checked + .sw::after { left: 17px; background: #ffb45e; box-shadow: 0 0 8px #ffb45e88; }
  .toggle input:focus-visible + .sw { outline: 2px solid #ffb45e88; outline-offset: 2px; }
  .toggle .tname { flex: 1; }

  /* One slider per row: name + value on top, track below. Only the selected
     filter's sliders are here — each filter declares its own set. */
  #params { display: flex; flex-direction: column; gap: 9px; }
  .prow { display: flex; flex-direction: column; gap: 2px; }
  .prow .head { display: flex; justify-content: space-between; align-items: baseline; }
  .prow .head span { color: #9c9aa2; }
  .prow .head output { color: #d8d6d0; font-variant-numeric: tabular-nums; }
  .prow input[type="range"] { width: 100%; accent-color: #ffb45e; margin: 0; }
  /* Filter off: the panel body dims, but the switch itself stays lit. */
  #side.off .filter-panel .panel-body { opacity: .4; }

  select {
    background: #1b1b1f; border: 1px solid #3a3a40; border-radius: 6px;
    color: #d8d6d0; font: inherit; padding: 5px 6px; width: 100%;
  }

  .seg { display: flex; border: 1px solid #3a3a40; border-radius: 6px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: #9c9aa2;
    padding: 4px 10px; font: inherit; cursor: pointer; flex: 1;
  }
  .seg button.on { background: #2c2c33; color: #f0eee8; }

  #stat { font-variant-numeric: tabular-nums; color: #77767d; }
  .keys { color: #5f5e66; font-size: 11px; }
  .keys kbd {
    border: 1px solid #33333a; border-radius: 4px; padding: 0 4px;
    font: 10px ui-monospace, monospace; color: #9c9aa2;
  }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 5px; padding-top: 6px; }

  main {
    position: relative; flex: 1; min-width: 0; overflow: auto;
    display: grid; place-items: center;
    background:
      radial-gradient(1200px 600px at 50% 0%, #151518, #101012);
  }
  main.z100 { display: block; padding: 24px; }
  main.z100 canvas { margin: 0 auto; }

  canvas {
    display: block;
    box-shadow: 0 8px 60px #000a, 0 0 0 1px #ffffff14;
  }
  /* The author rule above outranks the UA [hidden] rule, so the canvas would
     otherwise sit in the stage as a 300x150 ghost. */
  canvas[hidden], #empty[hidden] { display: none; }
  /* Empty state and canvas share one grid cell — they never stack. */
  #empty, canvas { grid-area: 1 / 1; place-self: center; }
  /* Fit = the whole picture, letterboxed. The canvas is a replaced element
     with an intrinsic size, so max-width/max-height clamp it on both axes
     while it keeps its aspect ratio. */
  main.fit {
    overflow: hidden; padding: 14px;
    grid-template-rows: 100%; grid-template-columns: minmax(0, 1fr);
  }
  main.fit canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  /* 100% = one source pixel per device pixel, scrollbars and all. */
  main.z100 canvas { max-width: none; max-height: none; width: auto; height: auto; margin: 0 auto; }

  #empty {
    text-align: center; color: #9c9aa2; line-height: 1.9; padding: 40px;
  }
  #empty kbd {
    border: 1px solid #3a3a40; border-radius: 4px; padding: 0 5px;
    font: 11px ui-monospace, monospace; color: #d8d6d0;
  }

  #chip {
    position: absolute; top: 12px; right: 14px;
    padding: 3px 10px; border-radius: 999px;
    background: #ffb45e22; border: 1px solid #ffb45e66; color: #ffb45e;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  main.on #chip { opacity: 1; }

  main.drag::after {
    content: "drop to load";
    position: absolute; inset: 10px; display: grid; place-items: center;
    border: 2px dashed #ffb45e88; border-radius: 10px;
    background: #101012cc; color: #ffb45e; font-size: 15px;
    pointer-events: none;
  }

  /* Narrow windows: the sidebar turns into a top strip so the picture still
     gets the full width, and the panels scroll sideways instead of pushing
     the image down. */
  @media (max-width: 700px) {
    body { flex-direction: column; }
    #side {
      flex: 0 0 auto; width: 100%;
      border-right: 0; border-bottom: 1px solid #26262a;
      flex-direction: row; align-items: flex-start;
      overflow-x: auto; overflow-y: hidden; gap: 14px;
    }
    #side .panel { min-width: 190px; }
    #side .panel.filter-panel { min-width: 230px; }
    .side-foot { margin-top: 0; padding-top: 0; }
  }
</style>

<aside id="side" class="side off">
  <div>
    <div class="logo">
      <span class="word">magic<span class="sep">–</span><b>manos</b></span>
    </div>
    <div class="tag">photographic filter lab</div>
  </div>

  <section class="panel image-panel">
    <div class="panel-head"><span class="label">Image</span></div>
    <div class="panel-body">
      <label class="btn">Choose image<input id="file" type="file" accept="image/*" hidden></label>
      <button id="sample" class="btn">Load Test pattern</button>
      <button id="forget" class="btn ghost" hidden>Clear image</button>
      <div class="row">
        <span class="mini">Dimensions</span>
        <span id="dims" class="dim">—</span>
      </div>
      <div class="row">
        <span class="mini">Zoom</span>
        <div class="seg" id="zoomseg"><button data-z="fit" class="on">Fit</button><button data-z="z100">100%</button></div>
      </div>
    </div>
  </section>

  <section class="panel filter-panel">
    <div class="panel-head">
      <span class="label">Filter</span>
      <label class="toggle" title="Filter on/off">
        <input id="on" type="checkbox" aria-label="Filter on/off">
        <span class="sw"></span>
      </label>
    </div>
    <div class="panel-body">
      <select id="filter" aria-label="Filter"></select>
      <div id="params"></div>
      <button id="reset" class="btn ghost">reset</button>
    </div>
  </section>

  <section class="panel export-panel">
    <div class="panel-head"><span class="label">Export</span></div>
    <div class="panel-body">
      <button id="save" class="btn" disabled>Save PNG</button>
      <button id="settings" class="btn">Settings ↓</button>
    </div>
  </section>

  <div class="side-foot">
    <div id="stat" class="dim">no image</div>
    <div class="keys"><kbd>f</kbd> filter · <kbd>s</kbd> save · <kbd>1</kbd>/<kbd>0</kbd> zoom</div>
  </div>
</aside>
<main id="stage" class="fit">
  <div id="empty">
    Drop an image here, choose a file, or press “Load Test pattern”.<br>
    <span class="dim">Your last image comes back on its own — until then, these are untouched source pixels.</span>
  </div>
  <canvas id="gl" hidden></canvas>
  <span id="chip"></span>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl'), empty = $('empty'), stat = $('stat');
const side = $('side'), onToggle = $('on');
// One-click filters registry — each entry owns its name, param surface and
// defaults. Bloom is the first; more slot in here. Exactly one filter is
// selected at a time, and its `kind` picks the renderer that draws it.
const FILTERS = {
  bloom: {
    name: 'Bloom',
    kind: 'bloom',
    // radius is the glow's width in source pixels — 18px of glow is 18px
    // whatever the frame is, so the look is what you dial in, not what the
    // resolution decides. (The preview is the full-res render scaled down by
    // the browser, so preview and export always agree.)
    //
    // Defaults are the user's call (2026-11-05): radius 18px, thresh 0.8,
    // sharp 0.5, boost 1.0 — a tight, bright glow. The Bloom evaluation on a
    // hard-midday 4608×3456 frame had preferred the opposite: a wide, weak
    // "dreamy" bloom, where a narrow strong bloom rings every high-contrast
    // edge and reads as a phone filter.
    defaults: { radius: 18, thresh: 0.8, sharp: 0.5, boost: 1.0 },
    params: [
      { key: 'radius', min: 0, max: 150, step: 1,
        fmt: v => `${Math.round(v)} px` },
      { key: 'thresh', min: 0, max: 1, step: 0.01 },
      { key: 'sharp',  min: 0, max: 1, step: 0.01 },
      { key: 'boost',  min: 0.5, max: 1.5, step: 0.01 },
    ],
  },
};
// The selected filter. One at a time — the dropdown picks it.
let currentFilter = 'bloom';
// Each filter keeps its own parameter values, so switching back and forth
// does not throw away a tweak.
let params = {};
for (const key in FILTERS) params[key] = { ...FILTERS[key].defaults };
let sliders = {}, outputs = {};
let imageName = null;

// --- remembering the filter state -----------------------------------------
// Every filter's parameters, the selected filter and the on/off switch are
// kept in localStorage, so the lab comes back the way you left it — and each
// filter keeps its own settings as more of them arrive.
const STATE_KEY = 'magic-manos.state';
let stateTimer = 0;

function saveState() {
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        filter: currentFilter,
        on: onToggle.checked,
        params,
      }));
    } catch (e) {
      // No storage (private mode, quota): the app still works, it just forgets.
    }
  }, 150);
}

// Read the saved state back. Anything unknown or out of range is dropped, so
// a stale or hand-edited entry can never break the panel.
function restoreState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return; }
  if (!s || typeof s !== 'object') return;
  if (s.filter && FILTERS[s.filter]) currentFilter = s.filter;
  for (const key in FILTERS) {
    const def = FILTERS[key];
    const base = { ...def.defaults };
    const stored = s.params && s.params[key];
    if (stored && typeof stored === 'object') {
      for (const d of def.params) {
        const v = Number(stored[d.key]);
        if (Number.isFinite(v)) base[d.key] = Math.min(d.max, Math.max(d.min, v));
      }
    }
    params[key] = base;
  }
  if (typeof s.on === 'boolean') onToggle.checked = s.on;
}
restoreState();

// The filter that is selected right now.
const currentEntry = () => ({ key: currentFilter, def: FILTERS[currentFilter], p: params[currentFilter] });

// Machinery, not creative controls — fixed like the original script's σ=3.
// Sigma is a fraction of the kernel half-span (σ=3 over N=6 → 0.5).
const SPREAD = 0.5;
// Blur downsample factor, derived per render: smallest power of two that keeps
// the blur radius ≤ ~24px at downsampled res, so tap spacing stays ≤ ~1px and
// sparse-kernel ghosting can never appear — 1/2 for small radii, up to 1/16.
// The radius is in source pixels, so it is compared against 24 directly.
let dsFactor = 0;
const DS = radius =>
  Math.min(16, Math.max(2, 2 ** Math.ceil(Math.log2(Math.max(1, radius) / 24))));

const gl = canvas.getContext('webgl2', { premultipliedAlpha: false, preserveDrawingBuffer: true })
        || canvas.getContext('webgl',  { premultipliedAlpha: false, preserveDrawingBuffer: true });

if (!gl) {
  empty.innerHTML = 'WebGL is not available in this browser.';
  throw new Error('no webgl');
}

// uFlipY selects the UV mapping per pass. Browser-uploaded textures are
// row-0-top, so canvas output samples them flipped (uFlipY=1). FBO passes
// render unflipped (uFlipY=0), which makes FBO row 0 the image top as well —
// every texture then reads v=0 = top under one convention. This is all
// because UNPACK_FLIP_Y_WEBGL is not reliably honored for ImageBitmap sources.
const VERT = `
attribute vec2 aPos;
uniform float uFlipY;
varying vec2 vUV;
void main() {
  vUV = vec2(aPos.x * 0.5 + 0.5, 0.5 + aPos.y * 0.5 * (uFlipY > 0.5 ? -1.0 : 1.0));
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const PRELUDE = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUV;
`;

// Copy/prefilter pass: plain copy when uThresh < 0, else per-channel soft knee
// max(c - t, 0). Run at the target's own size — with mipmapped sources the
// auto LOD gives an area downsample instead of a point sample.
const FRAG_PRE = PRELUDE + `
uniform sampler2D uTex;
uniform float uThresh;
void main() {
  vec4 c = texture2D(uTex, vUV);
  gl_FragColor = uThresh < 0.0 ? c : vec4(max(c.rgb - vec3(uThresh), vec3(0.0)), c.a);
}`;

// Separable gaussian, one axis per pass (uDir), taps spread across uRadiusPx
// in THIS texture's pixels — at downsampled res the spacing stays ≤ ~1px so
// there is no sparse-tap ghosting. A gaussian is exactly separable, so H+V
// equals the reference 2D kernel at a fraction of the cost.
const FRAG_BLUR = PRELUDE + `
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform vec2 uDir;
uniform float uRadiusPx;
uniform float uSigmaTaps;
void main() {
  const int N = 32;
  float twoSigma2 = 2.0 * uSigmaTaps * uSigmaTaps;
  vec4 sum = vec4(0.0);
  float total = 0.0;
  for (int i = -N; i <= N; i++) {
    float fi = float(i);
    float w = exp(-(fi * fi) / twoSigma2);
    vec2 o = vUV + uDir * ((fi / float(N)) * uRadiusPx) * uTexel;
    sum += texture2D(uTex, o) * w;
    total += w;
  }
  gl_FragColor = sum / total;
}`;

// Composite at full res: sharp layer at sharpAmt over the bilinear-upscaled
// soft layer, plus thresholded bloom × boost. The "upscale" is just LINEAR
// filtering on the small textures.
const FRAG_COMP = PRELUDE + `
uniform sampler2D uTex;
uniform sampler2D uSoft;
uniform sampler2D uBloom;
uniform float uSharp;
uniform float uBoost;
uniform float uOn;
void main() {
  vec4 sharp = texture2D(uTex, vUV);
  if (uOn < 0.5) { gl_FragColor = sharp; return; }
  vec4 outc = texture2D(uSoft, vUV) * (1.0 - uSharp) + sharp * uSharp;
  outc.rgb += texture2D(uBloom, vUV).rgb * uBoost;
  gl_FragColor = outc;
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const progPre = makeProgram(FRAG_PRE);
const progBlur = makeProgram(FRAG_BLUR);
const progComp = makeProgram(FRAG_COMP);

// Enumerate each program's uniforms once; lookups return null for anything the
// compiler dropped, which uniform*() calls then harmlessly ignore.
const UL = new Map();
for (const p of [progPre, progBlur, progComp]) {
  const m = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const u = gl.getActiveUniform(p, i);
    m[u.name] = gl.getUniformLocation(p, u.name);
  }
  UL.set(p, m);
}

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const isGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
const texFull = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texFull);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
// Mipmapped when WebGL2 allows it on this NPOT source: the downsample passes
// then get true area filtering for free. WebGL1 falls back to plain bilinear
// (slightly aliased downsample — acceptable, the blur hides it).
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, isGL2 ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);

let imgW = 0, imgH = 0, dsW = 0, dsH = 0, rafQueued = false;
const px = new Uint8Array(4);
let T = null; // thr (full res), soft/bloom/tmp (ds res)

function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo };
}

function allocTargets() {
  if (!imgW) return;
  if (T) for (const k in T) { gl.deleteTexture(T[k].tex); gl.deleteFramebuffer(T[k].fbo); }
  dsW = Math.max(1, Math.round(imgW / dsFactor));
  dsH = Math.max(1, Math.round(imgH / dsFactor));
  T = {
    thr:   makeTarget(imgW, imgH),
    soft:  makeTarget(dsW, dsH),
    bloom: makeTarget(dsW, dsH),
    tmp:   makeTarget(dsW, dsH),
  };
}

function bindTex(unit, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}

function pass(prog, target, w, h, setup) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog);
  const m = UL.get(prog);
  setup(n => m[n] || null);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function uploadSource(src, w, h) {
  imgW = w; imgH = h;
  canvas.width = w; canvas.height = h;
  gl.bindTexture(gl.TEXTURE_2D, texFull);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  if (isGL2) gl.generateMipmap(gl.TEXTURE_2D);
  dsFactor = DS(params[currentFilter].radius ?? 0);
  allocTargets();
  empty.hidden = true;
  canvas.hidden = false;
  $('save').disabled = false;
  $('forget').hidden = false;
  $('dims').textContent = `${imgW} × ${imgH}`;
  syncOutputs();
  render();
}

// Run the selected filter over `src` and write the result to `dst`
// (null = screen). The bloom pass order is unchanged: threshold at full res
// so speculars of any size survive the downsample, copy the source for the
// soft layer, blur both, composite.
function applyFilter(src, dst, entry) {
  const p = entry.p;
  pass(progPre, T.thr, imgW, imgH, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform1f(L('uThresh'), p.thresh);
    bindTex(0, src);
  });
  // T.thr downsamples with plain bilinear — it is about to be blurred anyway,
  // so a per-frame mip chain here is pure cost (~20ms measured).
  pass(progPre, T.soft, dsW, dsH, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform1f(L('uThresh'), -1);
    bindTex(0, src);
  });
  pass(progPre, T.bloom, dsW, dsH, L => {
    gl.uniform1f(L('uFlipY'), 0); gl.uniform1f(L('uThresh'), -1);
    bindTex(0, T.thr.tex);
  });
  const rds = p.radius / dsFactor;
  const st = SPREAD * 32;
  for (const t of [T.soft, T.bloom]) {
    pass(progBlur, T.tmp, dsW, dsH, L => {
      gl.uniform1f(L('uFlipY'), 0); gl.uniform2f(L('uTexel'), 1 / dsW, 1 / dsH);
      gl.uniform2f(L('uDir'), 1, 0); gl.uniform1f(L('uRadiusPx'), rds); gl.uniform1f(L('uSigmaTaps'), st);
      bindTex(0, t.tex);
    });
    pass(progBlur, t, dsW, dsH, L => {
      gl.uniform1f(L('uFlipY'), 0); gl.uniform2f(L('uTexel'), 1 / dsW, 1 / dsH);
      gl.uniform2f(L('uDir'), 0, 1); gl.uniform1f(L('uRadiusPx'), rds); gl.uniform1f(L('uSigmaTaps'), st);
      bindTex(0, T.tmp.tex);
    });
  }
  pass(progComp, dst, imgW, imgH, L => {
    gl.uniform1f(L('uFlipY'), dst ? 0 : 1);
    gl.uniform1f(L('uSharp'), p.sharp);
    gl.uniform1f(L('uBoost'), p.boost);
    gl.uniform1f(L('uOn'), 1);
    gl.uniform1i(L('uTex'), 0); gl.uniform1i(L('uSoft'), 1); gl.uniform1i(L('uBloom'), 2);
    bindTex(0, src); bindTex(1, T.soft.tex); bindTex(2, T.bloom.tex);
  });
}

// A filter's `kind` picks its renderer. A new look with its own pipeline
// gets a function here; everything else is wired to the bloom renderer.
const RENDERERS = { bloom: applyFilter };

function render() {
  if (!imgW || !T) return;
  const t0 = performance.now();
  const on = onToggle.checked;
  const entry = currentEntry();
  const f = DS(entry.p.radius ?? 0);
  if (f !== dsFactor) { dsFactor = f; allocTargets(); }
  if (!on) {
    // Filter stage off: show the source pixels, untouched.
    pass(progComp, null, imgW, imgH, L => {
      gl.uniform1f(L('uFlipY'), 1);
      gl.uniform1f(L('uSharp'), 1);
      gl.uniform1f(L('uBoost'), 0);
      gl.uniform1f(L('uOn'), 0);
      gl.uniform1i(L('uTex'), 0); gl.uniform1i(L('uSoft'), 1); gl.uniform1i(L('uBloom'), 2);
      bindTex(0, texFull); bindTex(1, T.soft.tex); bindTex(2, T.bloom.tex);
    });
  } else {
    RENDERERS[entry.def.kind](texFull, null, entry);
  }
  // gl.finish() only flushes the command buffer on most browsers; a readback
  // is what actually syncs on GPU completion, so the ms figure stays honest.
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const ms = (performance.now() - t0).toFixed(1);
  stat.textContent = `${on ? `${entry.def.name} · blur@1/${dsFactor} · ` : ''}render ${ms} ms`;
}

function scheduleRender() {
  if (rafQueued) return;
  rafQueued = true;
  requestAnimationFrame(() => { rafQueued = false; render(); });
}

async function loadFile(file) {
  imageName = file.name;
  rememberImage(file, file.name);
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    uploadSource(bmp, bmp.width, bmp.height);
    bmp.close();
  } catch {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { uploadSource(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); };
    img.src = url;
  }
}

// --- remembering the last image -------------------------------------------
// The picture is kept as a blob in IndexedDB: a 12MP JPEG is far past what
// localStorage will hold, and IndexedDB keeps it out of the URL.
const DB_NAME = 'magic-manos', DB_STORE = 'images', DB_KEY = 'last';
let dbPromise = null;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbPromise;
}

async function rememberImage(blob, name) {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put({ id: DB_KEY, name, blob, at: Date.now() });
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
    $('forget').hidden = false;
  } catch (e) {
    console.warn('could not remember the image:', e);
  }
}

async function recallImage() {
  try {
    const d = await db();
    const rec = await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readonly');
      const rq = tx.objectStore(DB_STORE).get(DB_KEY);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return rec && rec.blob ? rec : null;
  } catch (e) {
    console.warn('could not recall the image:', e);
    return null;
  }
}

async function forgetImage() {
  try {
    const d = await db();
    await new Promise((res, rej) => {
      const tx = d.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(DB_KEY);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) {
    console.warn('could not forget the image:', e);
  }
  $('forget').hidden = true;
}

// Clear the image: drop the remembered copy and empty the stage.
async function clearImage() {
  await forgetImage();
  imgW = 0; imgH = 0;
  imageName = null;
  canvas.hidden = true;
  empty.hidden = false;
  $('save').disabled = true;
  $('dims').textContent = '—';
  stat.textContent = 'no image';
}

// Bring back the last picture on the next visit.
(async function restoreLastImage() {
  const rec = await recallImage();
  if (!rec) return;
  imageName = rec.name;
  try {
    const bmp = await createImageBitmap(rec.blob, { imageOrientation: 'from-image' });
    uploadSource(bmp, bmp.width, bmp.height);
    bmp.close();
    $('forget').hidden = false;
  } catch (e) {
    console.warn('could not restore the image:', e);
  }
})();

function testPattern() {
  const w = 1440, h = 900, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#ffb066'); sky.addColorStop(.45, '#8a5f9e'); sky.addColorStop(1, '#1c1430');
  x.fillStyle = sky; x.fillRect(0, 0, w, h);
  const sun = x.createRadialGradient(w*.68, h*.42, 8, w*.68, h*.42, 170);
  sun.addColorStop(0, '#fff6dd'); sun.addColorStop(.25, '#ffd98a'); sun.addColorStop(1, '#ffd98a00');
  x.fillStyle = sun; x.fillRect(0, 0, w, h);
  x.fillStyle = '#171226';
  x.beginPath(); x.moveTo(0, h*.72);
  for (let i = 0; i <= 12; i++) x.lineTo(w * i / 12, h*.72 - Math.sin(i*1.7)*60 - 40);
  x.lineTo(w, h); x.lineTo(0, h); x.fill();
  x.fillStyle = '#0d0a18';
  x.fillRect(w*.08, h*.42, w*.3, h*.58);
  x.fillStyle = '#ffe9b0';
  for (let r = 0; r < 7; r++) for (let col = 0; col < 4; col++)
    if ((r + col) % 3) x.fillRect(w*.1 + col*w*.07, h*.46 + r*h*.075, w*.035, h*.038);
  const cols = ['#ff5470', '#3ec6ff', '#ffe066', '#7dff9b'];
  cols.forEach((col, i) => {
    x.fillStyle = col;
    x.beginPath(); x.arc(w*(.55 + i*.09), h*.8, 26, 0, 7); x.fill();
  });
  x.strokeStyle = '#ffffff'; x.lineWidth = 2;
  x.strokeRect(w*.86, h*.1, 90, 60);
  imageName = 'test-pattern';
  uploadSource(c, w, h);
  // The test pattern is remembered too — it is the picture that is loaded.
  c.toBlob(b => b && rememberImage(b, 'test-pattern'), 'image/png');
}

// --- wiring ---

$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
$('sample').addEventListener('click', testPattern);
$('forget').addEventListener('click', clearImage);
$('save').addEventListener('click', () => {
  render();
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `${currentFilter}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
});

// Download the selected filter + its params as versioned JSON — the timestamp
// is the version stamp of the recipe record.
$('settings').addEventListener('click', () => {
  const data = {
    version: new Date().toISOString(),
    app: 'magic-manos',
    filter: currentFilter,
    name: FILTERS[currentFilter].name,
    params: { ...params[currentFilter] },
    image: imageName,
    imageSize: imgW ? [imgW, imgH] : null,
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `magic-manos-${data.version.replace(/[:.]/g, '-')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

onToggle.addEventListener('change', () => {
  syncToggleUI();
  saveState();
  scheduleRender();
});

// The switch drives two things: whether the filter stage runs at all, and
// whether the panel reads as live or dimmed.
function syncToggleUI() {
  const on = onToggle.checked;
  stage.classList.toggle('on', on);
  side.classList.toggle('off', !on);
}

const fmt = (def, v) => def.fmt ? def.fmt(v) : v.toFixed(2);

// Build the filter section from the registry: the picker lists every filter,
// and the parameter rows below belong to the selected one — only the
// relevant ones, since each filter declares its own surface.
function buildControls() {
  // --- the picker is generated from the registry ---
  const sel = $('filter');
  sel.textContent = '';
  for (const [key, f] of Object.entries(FILTERS)) {
    const o = document.createElement('option');
    o.value = key; o.textContent = f.name;
    sel.append(o);
  }
  sel.value = currentFilter;

  // --- the selected filter's parameters ---
  const host = $('params');
  host.textContent = '';
  sliders = {}; outputs = {};
  const def = FILTERS[currentFilter];
  for (const d of def.params) {
    const row = document.createElement('div');
    row.className = 'prow';
    const head = document.createElement('div');
    head.className = 'head';
    const name = document.createElement('span');
    name.textContent = d.key;
    const out = document.createElement('output');
    out.textContent = fmt(d, params[currentFilter][d.key] ?? d.min);
    head.append(name, out);
    const input = document.createElement('input');
    input.type = 'range';
    input.id = `${currentFilter}-${d.key}`;
    input.min = d.min; input.max = d.max; input.step = d.step;
    input.value = params[currentFilter][d.key] ?? d.min;
    input.setAttribute('aria-label', `${def.name} ${d.key}`);
    row.append(head, input);
    host.append(row);
    sliders[d.key] = input;
    outputs[d.key] = out;
    input.addEventListener('input', () => {
      params[currentFilter][d.key] = parseFloat(input.value);
      out.textContent = fmt(d, params[currentFilter][d.key]);
      scheduleRender();
      saveState();
    });
  }
  $('chip').textContent = def.name;
}

function syncOutputs() {
  const def = FILTERS[currentFilter];
  for (const d of def.params) {
    const out = outputs[d.key];
    if (out) out.textContent = fmt(d, params[currentFilter][d.key]);
  }
}

$('filter').addEventListener('change', e => {
  currentFilter = e.target.value;
  buildControls();
  saveState();
  scheduleRender();
});

$('reset').addEventListener('click', () => {
  params[currentFilter] = { ...FILTERS[currentFilter].defaults };
  for (const [k, el] of Object.entries(sliders)) {
    el.value = params[currentFilter][k];
    el.dispatchEvent(new Event('input'));
  }
  saveState();
});

buildControls();
// The saved state may have left the filter stage switched on.
syncToggleUI();

$('zoomseg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const s of b.parentElement.children) s.classList.toggle('on', s === b);
  stage.classList.toggle('z100', b.dataset.z === 'z100');
  stage.classList.toggle('fit', b.dataset.z !== 'z100');
});

for (const ev of ['dragenter', 'dragover'])
  stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); });
for (const ev of ['dragleave', 'drop'])
  stage.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget && stage.contains(e.relatedTarget)) return;
    stage.classList.remove('drag');
    if (ev === 'drop') e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]);
  });

addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement && e.target.type === 'file') return;
  if (e.key === 'f') { onToggle.checked = !onToggle.checked; onToggle.dispatchEvent(new Event('change')); }
  else if (e.key === 's' && !$('save').disabled) $('save').click();
  else if (e.key === '1') document.querySelector('[data-z="z100"]').click();
  else if (e.key === '0') document.querySelector('[data-z="fit"]').click();
});
</script>
